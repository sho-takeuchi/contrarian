[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "contrarian-jp-screening"
version = "0.1.0"
description = "J-Quants monthly, weekly and daily three-stage screener"
requires-python = ">=3.11"
dependencies = ["requests>=2.34.2", "urllib3>=2.8.0", "tzdata>=2026.5; sys_platform == 'win32'"]

[project.scripts]
jp-screening = "jp_screening.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
