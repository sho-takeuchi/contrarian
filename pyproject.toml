[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "contrarian-jp-screening"
version = "0.1.0"
description = "J-Quants monthly, weekly and daily three-stage screener"
requires-python = ">=3.11"
dependencies = ["requests>=2.34.2", "urllib3>=2.8.0", "tzdata>=2026.5; sys_platform == 'win32'"]

[project.scripts]
jp-screening = "jp_screening.cli:main"
jp-analysis = "jp_screening.analysis.cli:main"

[project.optional-dependencies]
analysis = [
  "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1",
  "alembic>=1.16,<2", "pydantic>=2.11,<3", "python-dotenv>=1.1,<2",
  "streamlit>=1.50,<2", "python-docx>=1.2,<2",
  "beautifulsoup4>=4.13,<5", "pypdf>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

