services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: contrarian
      POSTGRES_USER: contrarian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - analysis_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contrarian -d contrarian"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  analysis_postgres:
