name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[analysis]"
      - run: python -c "from pathlib import Path; Path('data').mkdir(exist_ok=True)"
      - run: python -m unittest discover -s tests -v
      - name: Check Windows task registration and command execution
        if: runner.os == 'Windows' && matrix.python == '3.13'
        run: python tests/smoke_schedule.py
  postgres:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: disposable-ci-password
      POSTGRES_PORT: '55432'
      ANALYSIS_DATABASE_URL: postgresql+psycopg://contrarian:disposable-ci-password@127.0.0.1:55432/contrarian
      ANALYSIS_TEST_DATABASE_URL: postgresql+psycopg://contrarian:disposable-ci-password@127.0.0.1:55432/contrarian_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[analysis]"
      - name: Start the actual Compose configuration
        run: docker compose up -d --wait postgres
      - run: docker compose exec -T postgres createdb -U contrarian contrarian_test
      - run: python -m jp_screening.analysis db upgrade
      - run: python -c "from pathlib import Path; Path('data').mkdir(exist_ok=True)"
      - run: python -m unittest discover -s tests -v
      - name: Backup and restore into a separate database
        run: |
          docker compose exec -T postgres pg_dump -U contrarian -d contrarian -Fc -f /tmp/contrarian.dump
          docker compose exec -T postgres createdb -U contrarian contrarian_restore
          docker compose exec -T postgres pg_restore -U contrarian -d contrarian_restore --no-owner /tmp/contrarian.dump
          ANALYSIS_DATABASE_URL=postgresql+psycopg://contrarian:disposable-ci-password@127.0.0.1:55432/contrarian_restore python -m jp_screening.analysis db upgrade
      - name: Restart and verify persisted schema
        run: |
          docker compose restart postgres
          docker compose up -d --wait postgres
          python -m jp_screening.analysis db upgrade
      - name: Compose diagnostics
        if: failure()
        run: docker compose logs postgres
      - name: Remove disposable containers
        if: always()
        run: docker compose down -v
